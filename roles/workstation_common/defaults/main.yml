---
# system, user or all - selects which half of the role runs.
workstation_common_scope: system

# Selects environment-specific behaviour. Set per play, not per task.
user_environment: perso

user_shell: /usr/bin/zsh

workstation_admin_group: "{{ 'wheel' if ansible_os_family == 'RedHat' else 'sudo' }}"

# Passwords are deliberately not managed here so a run cannot lock an account out.
workstation_users:
  - name: christophe_perso
    comment: Profil personnel
    user_environment: perso
    groups:
      - "{{ workstation_admin_group }}"
  - name: christophe_work
    comment: Profil professionnel
    user_environment: work
    groups:
      - "{{ workstation_admin_group }}"

# Public keys only. Private keys are never stored in this repository.
common_pub_ssh_keys:
  - id_ed25519.pub

work_pub_ssh_keys:
  - id_rsa_work.pub

alternatives:
  - name: editor
    link: /usr/bin/editor
    path: /usr/bin/nvim
    priority: 10
    state: selected
  - name: vim
    link: /usr/bin/vim
    path: /usr/bin/nvim
    priority: 10
    state: selected

user_services:
  - name: ssh-agent
    enabled: true
    use: true
  - name: gnome-keyring-daemon
    enabled: true
    use: true

xdg_vars:
  profile_file: /etc/profile.d/xdg_dirs.sh
  lines:
    - line: "export XDG_CONFIG_HOME=\"$HOME/.config\""
      regexp: "export XDG_CONFIG_HOME="
      path: $HOME/.config
    - line: "export XDG_DATA_HOME=\"$HOME/.local/share\""
      regexp: "export XDG_DATA_HOME="
      path: $HOME/.local/share
    - line: "export XDG_CACHE_HOME=\"$HOME/.cache\""
      regexp: "export XDG_CACHE_HOME="
      path: $HOME/.cache
