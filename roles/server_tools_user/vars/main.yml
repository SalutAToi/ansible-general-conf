---
# using $HOME instead of XDG variables as profile.d vars are not evaluated by ansible
dotfiles:
  repo: https://github.com/SalutAToi/dotfiles.git
  bare_location: "{{ ansible_env.XDG_CONFIG_HOME | default(ansible_env.HOME + '/.config') }}/dotfiles"
  work_tree: "{{ ansible_env.HOME }}"

git_tools:
  - repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_env.XDG_CONFIG_HOME | default(ansible_env.HOME + '/.config') }}/tmux/plugins/tpm/"
    delete_git_folder: true
  - repo: https://github.com/LazyVim/starter
    dest: "{{ ansible_env.XDG_CONFIG_HOME | default(ansible_env.HOME + '/.config') }}/nvim"
    delete_git_folder: true

pipx_tools: []
  # ansible is not necessary on a server
