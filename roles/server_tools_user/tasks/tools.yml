---
- name: Installation et mise à jour des outils Python via uv
  ansible.builtin.command:
    cmd: >-
      uv tool install --upgrade
      {{ item.with | default([]) | map('regex_replace', '^(.*)$', '--with \1') | join(' ') }}
      {{ ('--with-executables-from ' ~ (item.with_executables_from | join(','))) if item.with_executables_from | default([]) | length > 0 else '' }}
      {{ item.name }}
  register: uv_tool_install
  changed_when: "'Checked' not in uv_tool_install.stdout"
  loop: "{{ uv_tools }}"
  loop_control:
    label: "{{ item.name }}"
  when: uv_tools | length > 0

- name: Mise à jour du PATH pour les outils uv
  ansible.builtin.command: uv tool update-shell
  register: uv_update_shell
  changed_when: "'already in PATH' not in uv_update_shell.stdout"
  when: uv_tools | length > 0

# Reset before clone so a previous clone or dotfiles-tracked content cannot conflict.
- name: Suppression des dossiers cibles avant clonage
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ git_tools }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Clonage des outils depuis les dépôts git
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
  loop: "{{ git_tools }}"
  loop_control:
    label: "{{ item.repo }}"

# LazyVim expects its starter to be detached from upstream so the config can be tracked
# in the user's own dotfiles.
- name: Suppression du dossier git des outils si nécessaire
  ansible.builtin.file:
    state: absent
    path: "{{ item.dest }}/.git"
  loop: "{{ git_tools | selectattr('delete_git_folder', 'defined') | selectattr('delete_git_folder') | list }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Suppression du gitignore des outils si nécessaire
  ansible.builtin.file:
    state: absent
    path: "{{ item.dest }}/.gitignore"
  loop: "{{ git_tools | selectattr('delete_git_folder', 'defined') | selectattr('delete_git_folder') | list }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Réapplication des dotfiles sur les chemins clonés
  ansible.builtin.include_role:
    name: dotfiles
    tasks_from: reapply
  vars:
    reapply_paths: "{{ git_tools | map(attribute='dest') | list }}"
