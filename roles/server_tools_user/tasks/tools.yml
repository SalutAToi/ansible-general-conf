---
- name: Installing python tools via pipx
  community.general.pipx:
    name: "{{ item.name }}"
    install_deps: "{{ item.install_deps }}"
    state: latest
  loop: "{{ pipx_tools }}"
  when: pipx_tools | length > 0

- name: Installing addtional requirements for pipx packages
  community.general.pipx:
    name: "{{ item.name }}"
    state: inject
    inject_packages: "{{ item.inject }}"
  when: 
   - item.inject | default([]) | length > 0
  loop: "{{ pipx_tools | default([]) }}"

- name: Ensure path with pipx
  ansible.builtin.command: pipx ensurepath
  when: pipx_tools | length > 0

- name: Ensure folders for git tools does not exist
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ git_tools }}"

- name: Cloning tools from git repos
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
  loop: "{{ git_tools }}"
  when: git_tools | length > 0

- name: Removing git folder on tools if needed
  ansible.builtin.file:
    state: absent
    dest: "{{ item.dest }}/.git"
  when: (git_tools | length > 0) and item.delete_git_folder
  loop: "{{ git_tools }}"

- name: Removing git folder on tools if needed
  ansible.builtin.file:
    state: absent
    dest: "{{ item.dest }}/.gitignore"
  when: (git_tools | length > 0) and item.delete_git_folder
  loop: "{{ git_tools }}"
