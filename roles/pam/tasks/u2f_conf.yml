---
- name: Lecture des mappings U2F existants
  ansible.builtin.slurp:
    src: "{{ u2f_mappings_file }}"
  register: u2f_existing
  failed_when: false
  changed_when: false

- name: Enregistrement des mappings U2F existants
  ansible.builtin.set_fact:
    u2f_existing_content: "{{ (u2f_existing.content | b64decode) if u2f_existing.content is defined else '' }}"

# Interactive: requires a YubiKey touch for each user not already enrolled.
- name: Récupération de la ligne de configuration U2F par utilisateur
  ansible.builtin.expect:
    command: "pamu2fcfg -u{{ item.username }} -opam://{{ inventory_hostname }} -ipam://{{ inventory_hostname }}"
    responses:
      "Enter PIN for": "{{ item.key_pin }}"
  register: u2f_registrations
  loop: "{{ u2f_users }}"
  loop_control:
    label: "{{ item.username }}"
  when: item.username ~ ':' not in u2f_existing_content

- name: Ajout des mappings U2F
  ansible.builtin.lineinfile:
    state: present
    path: "{{ u2f_mappings_file }}"
    line: "{{ item.stdout_lines[1] }}"
    mode: "0644"
    create: true
  loop: "{{ u2f_registrations.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when: not (item.skipped | default(false))
