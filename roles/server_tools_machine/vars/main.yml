---
# uv is not consistently packaged across supported distributions (missing on Ubuntu
# LTS/Debian stable), so it is installed via the vendor's own installer script rather
# than the distro package manager, matching AGENTS.md's third-party software rules.
uv_install_script_url: https://astral.sh/uv/install.sh
uv_install_dir: /usr/local/bin

alternatives:
  - name: editor
    link: /usr/bin/editor
    path: /usr/bin/nvim
    priority: 10
    state: selected
  - name: vim
    link: /usr/bin/vim
    path: /usr/bin/nvim
    priority: 10
    state: selected

packages:
  debian:
    - neovim
    - git
    - tmux
    - zsh
    - fzf
    - fd-find
    - ripgrep
    - bat
    - diffutils
    - gnupg
    - gcc
    - python3-dev
    - libmagic1
  ubuntu:
    - neovim
    - git
    - tmux
    - zsh
    - fzf
    - fd-find
    - ripgrep
    - bat
    - diffutils
    - gnupg
    - gcc
    - python3-dev
    - libmagic1
  redhat:
    - neovim
    - git
    - tmux
    - zsh
    - fd-find
    - ripgrep
    - fzf
    - bat
    - diffutils
    - gnupg2
    - gcc
    - python3-devel
    - file-libs
