---
- name: Installation des paquets serveur sur Debian
  ansible.builtin.package:
    name: "{{ packages.debian }}"
    state: present
  when: ansible_distribution == 'Debian'

- name: Installation d'EPEL sur redhat based
  ansible.builtin.package:
    name: epel-release
    state: present
  when: ansible_os_family == 'RedHat'

- name: Installation des paquets serveur sur Redhat based
  ansible.builtin.package:
    name: "{{ packages.redhat }}"
    state: present
  when: ansible_os_family == 'RedHat'
