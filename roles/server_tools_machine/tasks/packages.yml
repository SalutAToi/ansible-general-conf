---
- name: Installation des paquets serveur sur Debian based
  ansible.builtin.package:
    name: "{{ packages[ansible_distribution | lower] | default(packages.debian) }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Installation d'EPEL sur redhat based
  ansible.builtin.package:
    name: epel-release
    state: present
  when: ansible_os_family == "RedHat"

- name: Installation des paquets serveur sur Redhat based
  ansible.builtin.package:
    name: "{{ packages.redhat }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Installation système de uv
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -LsSf {{ uv_install_script_url }} | sh"
    executable: /bin/bash
    creates: "{{ uv_install_dir }}/uv"
  environment:
    UV_INSTALL_DIR: "{{ uv_install_dir }}"
    UV_NO_MODIFY_PATH: "1"
