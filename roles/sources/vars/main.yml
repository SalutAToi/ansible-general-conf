---
deb_reqs:
  - packagekit
  - apt-transport-https
  - curl
  - gpg
  - git
  - wget
  - ca-certificates
  - lsb-release
  - debian-archive-keyring
  - flatpak
rpm_reqs:
  - PackageKit
  - libxcrypt-compat.x86_64
  - dnf-plugins-core
  - ca-certificates
  - curl
  - gnupg2
  - git
  - wget
  - lsb-release

deb_keys: []

copr_projects:
  - zeno/scrcpy
  - alternateved/keyd

rpm_repos:
  # protonvpn
  - name: protonvpn-fedora-stable
    description: ProtonVPN Fedora Stable repository
    baseurl: https://repo.protonvpn.com/fedora-$releasever-stable
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    ssl_verify: true
    gpgkey: https://repo.protonvpn.com/fedora-$releasever-stable/public_key.asc
  # speedtest-cli
  - name: ookla_speedtest-cli
    description: Speedtest CLI by Ookla - Fedora Stable repository
    baseurl: https://packagecloud.io/ookla/speedtest-cli/fedora/$releasever/$basearch
    enabled: true
    gpgcheck: false
    repo_gpgcheck: true
    ssl_verify: true
    gpgkey: https://packagecloud.io/ookla/speedtest-cli/gpgkey
# deb repos according to deb822 specification
# signed-by can be a link to a armored or binary key, an url to it or the base64 value
deb_repos:
  - name: protonvpn-stable
    enabled: true
    types: deb
    uris:
      - https://repo.protonvpn.com/debian
    suites: stable
    components: main
    architectures: "{{ package_arch }}"
    signed_by: https://repo.protonvpn.com/debian/public_key.asc
  # keyd is not packaged for Ubuntu LTS releases, only for newer ones, so the
  # project's own backport PPA is used instead (matches Pop!_OS, an Ubuntu LTS base)
  - name: keyd-team-ppa
    enabled: true
    types: deb
    uris:
      - https://ppa.launchpadcontent.net/keyd-team/ppa/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: main
    architectures: "{{ package_arch }}"
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x67D33FE29A58DA9441D20A9DCD9F79EC6A8AFB2F"
